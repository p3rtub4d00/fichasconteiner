name: One-time Admin Dashboard Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply dashboard-only changes
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('public/index.html')
          style_path = Path('public/style.css')

          index = index_path.read_text(encoding='utf-8')
          style = style_path.read_text(encoding='utf-8')

          marker = '        <main class="admin-container admin-workspace">'
          panel = '''        <section id="admin-overview-panel" class="admin-overview-panel">
              <div class="overview-hero">
                  <div>
                      <span class="overview-kicker">CENTRAL DE OPERAÇÃO</span>
                      <h2>Controle rápido do bar</h2>
                      <p>Acesse as áreas principais do sistema sem alterar o fluxo de atendimento.</p>
                  </div>
                  <div class="overview-live"><span></span> Sistema operacional</div>
              </div>
              <div class="overview-actions">
                  <button class="overview-action" onclick="openAdminPage('sales')">
                      <span class="overview-action-icon">💰</span>
                      <span class="overview-action-copy"><strong>Vendas & Caixa</strong><small>Faturamento, suprimentos, sangrias e fechamento.</small></span>
                      <b>→</b>
                  </button>
                  <button class="overview-action" onclick="openAdminPage('products')">
                      <span class="overview-action-icon">📦</span>
                      <span class="overview-action-copy"><strong>Produtos & Estoque</strong><small>Produtos, categorias e lista de compras.</small></span>
                      <b>→</b>
                  </button>
                  <button class="overview-action" onclick="openAdminPage('customers')">
                      <span class="overview-action-icon">👥</span>
                      <span class="overview-action-copy"><strong>Clientes & Clube</strong><small>Cadastro, crédito, fiado e histórico.</small></span>
                      <b>→</b>
                  </button>
                  <button class="overview-action" onclick="openAdminPage('tables')">
                      <span class="overview-action-icon">🪑</span>
                      <span class="overview-action-copy"><strong>Mesas & Comandas</strong><small>Gerencie as mesas e acompanhe comandas abertas.</small></span>
                      <b>→</b>
                  </button>
                  <button class="overview-action" onclick="openAdminPage('settings')">
                      <span class="overview-action-icon">🔐</span>
                      <span class="overview-action-copy"><strong>Segurança</strong><small>Alteração da senha administrativa.</small></span>
                      <b>→</b>
                  </button>
              </div>
              <div class="overview-note"><span>ℹ️</span><div><strong>Os indicadores acima continuam usando os dados atuais do sistema.</strong><small>Nesta etapa foi alterada somente a apresentação e os atalhos da visão geral. Nenhuma regra de venda, PIX, impressão, estoque ou comanda foi modificada.</small></div></div>
          </section>
'''

          if 'id="admin-overview-panel"' not in index:
              if marker not in index:
                  raise SystemExit('Marcador do workspace administrativo não encontrado.')
              index = index.replace(marker, panel + marker, 1)
              index_path.write_text(index, encoding='utf-8')

          css = r'''

/* ================= DASHBOARD ADMINISTRATIVO - ETAPA 2 ================= */
#admin-view .admin-overview-panel{margin:0 0 16px;padding:20px;background:linear-gradient(145deg,rgba(20,27,39,.98),rgba(13,18,27,.98));border:1px solid var(--border);border-radius:17px;box-shadow:0 12px 32px rgba(0,0,0,.1)}
#admin-view .overview-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 2px 18px;border-bottom:1px solid var(--border)}
#admin-view .overview-kicker{display:inline-block;color:var(--primary);font-size:10px;font-weight:800;letter-spacing:1.2px;margin-bottom:7px}
#admin-view .overview-hero h2{font-size:21px;letter-spacing:-.5px;margin:0 0 5px;color:var(--text-main)}
#admin-view .overview-hero p{font-size:11px;color:var(--text-muted);line-height:1.5;margin:0}
#admin-view .overview-live{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:8px 11px;border:1px solid rgba(36,200,138,.2);border-radius:999px;background:rgba(36,200,138,.07);color:var(--success);font-size:10px;font-weight:700}
#admin-view .overview-live span{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(36,200,138,.1)}
#admin-view .overview-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
#admin-view .overview-action{width:100%;min-height:76px;display:grid;grid-template-columns:40px 1fr 20px;align-items:center;gap:11px;padding:12px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:13px;color:var(--text-main);text-align:left;box-shadow:none}
#admin-view .overview-action:hover{transform:translateY(-1px);border-color:rgba(247,181,27,.45);background:rgba(247,181,27,.055);box-shadow:0 8px 22px rgba(0,0,0,.12)}
#admin-view .overview-action-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:var(--primary-soft);font-size:19px}
#admin-view .overview-action-copy{min-width:0;display:flex;flex-direction:column;gap:4px}
#admin-view .overview-action-copy strong{font-size:12px;color:var(--text-main)}
#admin-view .overview-action-copy small{font-size:10px;color:var(--text-muted);line-height:1.35;font-weight:500}
#admin-view .overview-action>b{color:var(--primary);font-size:18px;text-align:right}
#admin-view .overview-note{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px 12px;border:1px solid rgba(77,163,255,.16);background:rgba(77,163,255,.055);border-radius:11px;color:var(--text-muted)}
#admin-view .overview-note>span{font-size:15px;line-height:1.2}
#admin-view .overview-note div{display:flex;flex-direction:column;gap:3px}
#admin-view .overview-note strong{font-size:10px;color:var(--text-main)}
#admin-view .overview-note small{font-size:10px;line-height:1.45;color:var(--text-muted)}
@media(max-width:760px){#admin-view .admin-overview-panel{padding:15px;border-radius:14px}#admin-view .overview-hero{align-items:flex-start;flex-direction:column;padding-bottom:14px}#admin-view .overview-live{align-self:flex-start}#admin-view .overview-actions{grid-template-columns:1fr;gap:8px}#admin-view .overview-action{min-height:70px}}
'''

          if 'DASHBOARD ADMINISTRATIVO - ETAPA 2' not in style:
              style_path.write_text(style + css, encoding='utf-8')
      
      - name: Commit dashboard changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/style.css .github/workflows/one-time-admin-dashboard.yml
          git rm .github/workflows/one-time-admin-dashboard.yml
          git commit -m "Dashboard administrativo etapa 2 [dashboard-v2]"
          git push
