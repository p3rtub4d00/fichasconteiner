name: Finalizar dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir dashboard sem alterar o restante do PDV
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="dashboard.js"></script>'
          text = text.replace(tag + '\n', '').replace(tag, '')
          marker = '<script src="app.js"></script>'
          if marker not in text:
              raise SystemExit('Marcador app.js não encontrado; nenhuma alteração aplicada.')
          text = text.replace(marker, marker + '\n    ' + tag, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit final e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm .github/workflows/repair-dashboard-index.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Ativar dashboard profissional [dashboard-final]"
          git push
