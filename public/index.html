<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteiner Beer - PDV</title>
    
    <!-- TAGS PARA O APP (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para o novo Menu do Garçom */
        .waiter-menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:20px; }
        .btn-main-menu { background:var(--bg-card); border:2px solid var(--primary); color:var(--text-main); border-radius:12px; padding:25px 10px; font-size:15px; font-weight:bold; display:flex; flex-direction:column; align-items:center; gap:12px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.2); transition:transform .1s,border-color .2s; }
        .btn-main-menu span.icon { font-size:32px; }
        .btn-main-menu:active { transform:scale(.95); }
        /* DASHBOARD PROFISSIONAL - ETAPA 2 */
        #admin-overview{display:none;margin:0 0 16px}.overview-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:4px 2px 18px;margin-bottom:14px;border-bottom:1px solid var(--border)}.overview-eyebrow{display:block;color:var(--primary);font-size:10px;font-weight:800;letter-spacing:1.4px;margin-bottom:6px}.overview-top h2{font-size:22px;letter-spacing:-.6px;margin:0 0 5px;color:var(--text-main)}.overview-top p{font-size:11px;color:var(--text-muted);line-height:1.5}.connection-badge{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;border:1px solid rgba(36,200,138,.22);background:rgba(36,200,138,.07);color:var(--success);font-size:10px;white-space:nowrap}.connection-badge span{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(36,200,138,.09)}.connection-badge.offline{color:var(--danger);border-color:rgba(239,91,99,.25);background:rgba(239,91,99,.07)}.connection-badge.syncing{color:var(--primary);border-color:rgba(247,181,27,.25);background:rgba(247,181,27,.07)}.overview-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.85fr);gap:14px}.overview-card{min-width:0;padding:18px;background:linear-gradient(145deg,rgba(20,27,39,.98),rgba(14,19,28,.98));border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.09)}.overview-chart-card{grid-row:span 2}.overview-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.overview-label{display:block;color:var(--text-soft);font-size:9px;font-weight:800;letter-spacing:1px;margin-bottom:4px}.overview-card h3{font-size:13px;color:var(--text-main);margin:0}.overview-total{font-size:16px;font-weight:800;color:var(--success)}.overview-mini-badge{padding:5px 8px;border-radius:999px;background:rgba(77,163,255,.09);color:var(--info);font-size:9px;font-weight:800;white-space:nowrap}.overview-mini-badge.warning{background:rgba(247,181,27,.1);color:var(--primary)}.sales-hour-chart{height:190px;display:flex;align-items:flex-end;gap:8px;padding:8px 2px 0}.sales-hour-bar{flex:1;min-width:18px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.sales-hour-bar .bar-value{font-size:8px;color:var(--text-soft);min-height:10px;white-space:nowrap}.sales-hour-bar .bar{width:100%;max-width:32px;min-height:4px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--primary),rgba(247,181,27,.25));transition:height .35s ease}.sales-hour-bar .hour{font-size:8px;color:var(--text-muted)}.overview-list{display:flex;flex-direction:column;gap:7px;max-height:184px;overflow:auto}.overview-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:rgba(255,255,255,.03)}.overview-row:hover{border-color:var(--border)}.overview-row-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);font-size:13px;flex:0 0 auto}.overview-row-main{min-width:0;flex:1}.overview-row-main strong{display:block;color:var(--text-main);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.overview-row-main small{display:block;color:var(--text-muted);font-size:9px;margin-top:2px}.overview-row-value{font-size:10px;font-weight:800;color:var(--text-main);white-space:nowrap}.overview-empty{padding:22px 10px;text-align:center;color:var(--text-muted);font-size:10px;border:1px dashed var(--border);border-radius:10px}.overview-quick-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.overview-quick-actions button{display:grid;grid-template-columns:34px 1fr 14px;align-items:center;gap:9px;text-align:left;padding:11px;background:rgba(255,255,255,.035);border:1px solid var(--border);color:var(--text-main);box-shadow:none}.overview-quick-actions button:hover{border-color:rgba(247,181,27,.45);background:rgba(247,181,27,.05)}.overview-quick-actions button>span{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--primary-soft);font-size:15px}.overview-quick-actions button div{min-width:0}.overview-quick-actions strong,.overview-quick-actions small{display:block}.overview-quick-actions strong{font-size:10px}.overview-quick-actions small{font-size:8px;color:var(--text-muted);margin-top:3px}.overview-quick-actions b{color:var(--primary);font-size:15px}@media(max-width:1050px){.overview-grid{grid-template-columns:1fr}.overview-chart-card{grid-row:auto}.overview-quick-actions{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.overview-top{flex-direction:column}.overview-quick-actions{grid-template-columns:1fr}.sales-hour-chart{gap:4px}.sales-hour-bar .hour{font-size:7px}.overview-card{padding:14px}}
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="login-view" class="view active">
        <div class="theme-toggle-container"><button class="theme-btn" onclick="toggleTheme()">🌓 Tema</button></div>
        <div class="login-box"><h1>Conteiner Beer</h1><input type="password" id="pin-input" placeholder="Senha de Acesso"><button onclick="login()">Entrar</button></div>
    </div>
    <!-- TELA ADMIN -->
    <div id="admin-view" class="view">
        <header class="admin-header"><div style="display:flex;gap:10px;align-items:center;"><h1>Painel Admin - Conteiner Beer</h1><button class="theme-btn" onclick="toggleTheme()">🌓</button></div><button onclick="logout()" class="btn-danger">Sair</button></header>
        <nav class="admin-nav" aria-label="Navegação do painel"><button class="active" data-admin-page="overview" onclick="openAdminPage('overview')"><span>▦</span> Visão geral</button><button data-admin-page="sales" onclick="openAdminPage('sales')"><span>◫</span> Vendas & Caixa</button><button data-admin-page="products" onclick="openAdminPage('products')"><span>□</span> Produtos</button><button data-admin-page="customers" onclick="openAdminPage('customers')"><span>♙</span> Clientes</button><button data-admin-page="tables" onclick="openAdminPage('tables')"><span>⌘</span> Mesas</button><button data-admin-page="settings" onclick="openAdminPage('settings')"><span>⚙</span> Ajustes</button></nav>
        <section id="admin-summary" class="admin-summary"><article class="summary-card"><span>Vendas confirmadas</span><strong id="metric-sales">R$ 0,00</strong><small>no dia selecionado</small></article><article class="summary-card"><span>Pedidos do dia</span><strong id="metric-orders">0</strong><small>incluindo pendentes</small></article><article class="summary-card"><span>Mesas ocupadas</span><strong id="metric-tables">0</strong><small>comandas em aberto</small></article><article class="summary-card"><span>Estoque baixo</span><strong id="metric-stock">0</strong><small>produtos com até 5 un.</small></article></section>
'''+dashboard_html+'''        <main class="admin-container admin-workspace">'''+orig.split('        <main class="admin-container admin-workspace">',1)[1].split('</body>',1)[0]+'''</body>
</html>'''
